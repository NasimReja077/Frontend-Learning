<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lights + Animation + Controls</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #info {
      position: absolute; top: 10px; left: 10px; color: white; 
      font-family: Arial, sans-serif; background: rgba(0,0,0,0.5); 
      padding: 10px; border-radius: 6px;
    }
  </style>
</head>
<body>
  <div id="info">Drag to rotate • Scroll to zoom • Lights + Animation</div>

  <script type="module">
    import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.134.0/examples/jsm/controls/OrbitControls.js';

    // Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111122);

    // Camera
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 3, 6);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;   // Enable shadows
    document.body.appendChild(renderer.domElement);

    // ========================
    // LIGHTS
    // ========================
    
    // 1. Ambient Light (soft overall illumination)
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    // 2. Directional Light (like sunlight) - casts shadows
    const directionalLight = new THREE.DirectionalLight(0xffeedd, 1.2);
    directionalLight.position.set(5, 10, 7);
    directionalLight.castShadow = true;
    scene.add(directionalLight);

    // 3. Point Light (colored glowing light)
    const pointLight = new THREE.PointLight(0x88ccff, 1.5, 100);
    pointLight.position.set(-6, 4, -5);
    scene.add(pointLight);

    // ========================
    // OBJECT (Mesh)
    // ========================
    const geometry = new THREE.BoxGeometry(2, 2, 2);
    const material = new THREE.MeshStandardMaterial({ 
      color: 0x44ff88,
      metalness: 0.3,
      roughness: 0.4
    });
    const cube = new THREE.Mesh(geometry, material);
    cube.castShadow = true;
    cube.receiveShadow = true;
    scene.add(cube);

    // Add a floor
    const floorGeo = new THREE.PlaneGeometry(20, 20);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.1;
    floor.receiveShadow = true;
    scene.add(floor);

    // ========================
    // CONTROLS (Mouse Interaction)
    // ========================
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;      // Smooth movement
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0, 0);       // Look at center

    // ========================
    // ANIMATION
    // ========================
    let time = 0;

    function animate() {
      requestAnimationFrame(animate);
      
      time += 0.016;

      // Animate the cube
      cube.rotation.x = time * 0.6;
      cube.rotation.y = time * 0.9;

      // Gentle floating
      cube.position.y = Math.sin(time * 2) * 0.2;

      // Update controls
      controls.update();

      renderer.render(scene, camera);
    }

    animate();

    // Resize handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
