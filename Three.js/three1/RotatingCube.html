<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three.js Rotating Cube</title>
  <style>
    body { 
      margin: 0; 
      overflow: hidden; 
      background: #000;
    }
    canvas { 
      display: block; 
    }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js';

    // Scene setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    // Camera
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 3;

    // Renderer
    const renderer = new THREE.WebGLRenderer({ 
      antialias: true 
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // Cube
    const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
    const material = new THREE.MeshPhongMaterial({ 
      color: 0x44aa88,
      shininess: 100,
      specular: 0x222222
    });
    const cube = new THREE.Mesh(geometry, material);
    scene.add(cube);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
    directionalLight.position.set(5, 10, 7);
    scene.add(directionalLight);

    const pointLight = new THREE.PointLight(0x88aaff, 1, 100);
    pointLight.position.set(-5, -5, 5);
    scene.add(pointLight);

    // Animation variables
    let time = 0;

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);

      time += 0.016; // ~60fps delta

      // Rotate cube smoothly on all axes
      cube.rotation.x = time * 0.8;
      cube.rotation.y = time * 1.2;
      cube.rotation.z = time * 0.5;

      // Gentle floating motion
      cube.position.y = Math.sin(time * 1.5) * 0.1;

      renderer.render(scene, camera);
    }

    animate();

    // Responsive handling
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Optional: Click to change color
    window.addEventListener('click', () => {
      const randomColor = Math.random() * 0xffffff;
      cube.material.color.set(randomColor);
    });
  </script>
</body>
</html>
